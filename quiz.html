<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>你的灵魂是哪幅名画</title>
<style>
:root{
  --bg:#12100f; --card:#1c1917; --line:#2e2a26; --fg:#f2ece4;
  --sub:#a89e93; --gold:#c8a34e; --accent:#d9694a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:24px 20px 40px;flex:1;display:flex;flex-direction:column}
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
.cover h1{font-size:30px;line-height:1.35;margin:0;letter-spacing:1px}
.cover h1 em{font-style:normal;color:var(--gold)}
.cover p{color:var(--sub);margin:0;font-size:15px}
.btn{
  display:block;width:100%;padding:16px;border:0;border-radius:999px;
  background:var(--fg);color:#12100f;font-size:17px;font-weight:600;letter-spacing:1px;
  cursor:pointer;margin-top:8px;
}
.btn:active{transform:scale(.985)}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:400;font-size:15px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s ease}
.qnum{color:var(--gold);font-size:13px;letter-spacing:2px;margin-bottom:10px}
.qtext{font-size:21px;line-height:1.5;margin:0 0 26px;font-weight:600}
.opt{
  display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:12px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  color:var(--fg);font-size:16px;line-height:1.55;cursor:pointer;transition:.15s;
}
.opt:active{background:#26221e;border-color:var(--gold)}
.result-head{text-align:center;margin-bottom:8px}
.result-head .eyebrow{color:var(--gold);font-size:13px;letter-spacing:3px}
.result-head h2{font-size:25px;margin:10px 0 6px;line-height:1.4}
.result-head .painting{color:var(--sub);font-size:14px}
.art{
  width:100%;border-radius:14px;display:block;margin:18px 0 22px;
  background:#000;aspect-ratio:4/3;object-fit:cover;
}
.copy p{margin:0 0 16px;word-break:break-word;overflow-wrap:anywhere}
.copy b{color:var(--gold);font-weight:600}
.copy ul{padding-left:18px;margin:0 0 16px;word-break:break-word}
.copy li{margin-bottom:10px}
.copy blockquote{
  margin:22px 0;padding:16px 18px;border-left:2px solid var(--gold);
  background:var(--card);border-radius:0 10px 10px 0;color:var(--fg);font-size:16px;
}
.dims{margin:26px 0 10px;padding-top:20px;border-top:1px solid var(--line)}
.dim{margin-bottom:14px;font-size:13px;color:var(--sub)}
.dim .lab{display:flex;justify-content:space-between;margin-bottom:5px}
.dim .track{height:5px;background:var(--line);border-radius:3px;position:relative}
.dim .track i{position:absolute;top:0;height:100%;background:var(--accent);border-radius:3px}
.foot{color:#6b625a;font-size:12px;text-align:center;margin-top:26px;line-height:1.7}

.artwrap{margin:20px 0 26px;background:#0b0a09;border:1px solid #322c25;border-radius:6px;padding:10px}
.art{border-radius:2px;margin:0;max-height:62vh;object-fit:contain;display:block;width:100%;background:#080706;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.artcap{display:flex;flex-direction:column;gap:3px;padding:12px 4px 4px;text-align:center}
.artname{font-size:15px;color:#e8e0d5;letter-spacing:.5px}
.artmeta{font-size:12px;color:#8d8378;letter-spacing:1px}
.artplace{font-size:11px;color:#6b625a;letter-spacing:.5px}
.copy blockquote{margin:26px 0 8px;padding:22px 20px;border:1px solid #3a332b;border-left:3px solid var(--gold);border-radius:4px;background:linear-gradient(160deg,#1f1b17,#171412);color:#f6f0e6;font-size:19px;line-height:1.7;text-align:center;letter-spacing:.5px}
.copy h3{font-size:15px;color:var(--gold);letter-spacing:1px;margin:26px 0 8px;font-weight:600}
.copy ul li{margin-bottom:9px}
.copy p b{color:var(--gold)}
.sharehint{margin:18px 0 0;text-align:center;color:#6b625a;font-size:12px;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DATA = {"title": "你的灵魂是哪幅名画", "dimensions": {"S": {"name": "结构", "low": "随性", "high": "秩序"}, "E": {"name": "外放", "low": "内敛", "high": "外放"}, "D": {"name": "梦境", "low": "现实", "high": "象征"}, "R": {"name": "锐利", "low": "温和", "high": "锐利"}}, "questions": [{"id": 1, "dim": "S", "text": "出去玩的前一天晚上，你在做什么？", "options": [{"text": "路线、餐厅、时间全排好，连备用方案都有", "score": 2}, {"text": "车票酒店订了，其他到了再说", "score": 1}, {"text": "想到哪玩到哪", "score": -1}, {"text": "被人拉走就行，我什么都不用管", "score": -2}]}, {"id": 2, "dim": "S", "text": "你手机相册现在什么样子？", "options": [{"text": "分文件夹、命名规范，找什么都一秒", "score": 2}, {"text": "大概有分类，偶尔乱一下", "score": 1}, {"text": "全堆在一个相册里", "score": -1}, {"text": "翻半天找不到要的那张", "score": -2}]}, {"id": 3, "dim": "S", "text": "要做一件事，你第一反应是？", "options": [{"text": "先想清楚步骤再动手", "score": 2}, {"text": "大概有个方向就开始", "score": 1}, {"text": "先做，边做边改", "score": -1}, {"text": "凭感觉来，做完再说", "score": -2}]}, {"id": 4, "dim": "E", "text": "一群人聊天时，你通常在？", "options": [{"text": "主导话题，声音最大那个", "score": 2}, {"text": "时不时插话，能聊得起来", "score": 1}, {"text": "主要听，偶尔应一声", "score": -1}, {"text": "安静待着，脑子里在别处", "score": -2}]}, {"id": 5, "dim": "E", "text": "心情不好的时候你会？", "options": [{"text": "找人说话，说出来就好了", "score": 2}, {"text": "出门走走，见点人", "score": 1}, {"text": "自己待一会儿", "score": -1}, {"text": "消失几天，谁也别找我", "score": -2}]}, {"id": 6, "dim": "E", "text": "你的社交电量是？", "options": [{"text": "越聊越有劲", "score": 2}, {"text": "聊得来的人能聊一整晚", "score": 1}, {"text": "聊完需要独处充电", "score": -1}, {"text": "能不聊就不聊", "score": -2}]}, {"id": 7, "dim": "D", "text": "你更容易被什么打动？", "options": [{"text": "一个具体的、真实发生过的故事", "score": -2}, {"text": "一封写得好但有点绕的信", "score": -1}, {"text": "一段旋律或一张画，说不清为什么", "score": 1}, {"text": "一个梦，醒了还记得", "score": 2}]}, {"id": 8, "dim": "D", "text": "你记东西的方式是？", "options": [{"text": "记事实、数字、细节", "score": -2}, {"text": "记大概，能复述出来", "score": -1}, {"text": "记感觉和氛围", "score": 1}, {"text": "记画面和意象，像放电影", "score": 2}]}, {"id": 9, "dim": "D", "text": "别人说你「想太多」，通常是什么情况？", "options": [{"text": "很少被这么说", "score": -2}, {"text": "偶尔，我会琢磨事情", "score": -1}, {"text": "经常，我脑子里总有别的画面", "score": 1}, {"text": "一直是，我大概活在另一个世界", "score": 2}]}, {"id": 10, "dim": "R", "text": "遇到不认同的事，你会？", "options": [{"text": "直接说，不留情面", "score": 2}, {"text": "说，但会挑措辞", "score": 1}, {"text": "不说，但心里有账", "score": -1}, {"text": "算了，不值得", "score": -2}]}, {"id": 11, "dim": "R", "text": "你更喜欢哪一种美？", "options": [{"text": "干净、留白、克制", "score": -2}, {"text": "温暖、柔和、有呼吸感", "score": -1}, {"text": "强烈、有冲击，看着不舒服也要看", "score": 1}, {"text": "破碎、扭曲、有点危险", "score": 2}]}, {"id": 12, "dim": "R", "text": "你的幽默感偏向？", "options": [{"text": "温和的调侃", "score": -2}, {"text": "自嘲", "score": -1}, {"text": "冷的、损的", "score": 1}, {"text": "黑色的，让人愣一下那种", "score": 2}]}], "results": [{"key": "starry", "painting": "星月夜", "artist": "梵高", "year": 1889, "title": "心里有漩涡的人", "v": {"S": -1, "E": -2, "D": 3, "R": 3}, "place": "纽约现代艺术博物馆 MoMA"}, {"key": "scream", "painting": "呐喊", "artist": "蒙克", "year": 1893, "title": "替所有人先听见警报的人", "v": {"S": -2, "E": 2, "D": 3, "R": 4}, "place": "挪威国家博物馆"}, {"key": "pearl", "painting": "戴珍珠耳环的少女", "artist": "维米尔", "year": 1665, "title": "什么都没说就全都看见的人", "v": {"S": 3, "E": -3, "D": -3, "R": -1}, "place": "海牙莫瑞泰斯皇家美术馆"}, {"key": "kiss", "painting": "吻", "artist": "克里姆特", "year": 1908, "title": "一旦投入就不留退路的人", "v": {"S": 3, "E": -1, "D": 3, "R": -3}, "place": "维也纳美景宫"}, {"key": "grande", "painting": "大碗岛的星期天下午", "artist": "修拉", "year": 1886, "title": "用耐心对抗混乱的人", "v": {"S": 4, "E": 0, "D": -3, "R": -3}, "place": "芝加哥艺术学院"}, {"key": "memory", "painting": "记忆的永恒", "artist": "达利", "year": 1931, "title": "时间在你身上是软的", "v": {"S": -1, "E": 1, "D": 4, "R": 0}, "place": "纽约现代艺术博物馆 MoMA"}, {"key": "compo8", "painting": "构成第八号", "artist": "康定斯基", "year": 1923, "title": "脑子里的声音比别人多", "v": {"S": -1, "E": 4, "D": 0, "R": 2}, "place": "纽约古根海姆博物馆"}, {"key": "ophelia", "painting": "奥菲莉亚", "artist": "米莱", "year": 1852, "title": "沉在水里还在唱歌的人", "v": {"S": 0, "E": -4, "D": 2, "R": -3}, "place": "伦敦泰特不列颠"}, {"key": "liberty", "painting": "自由引导人民", "artist": "德拉克洛瓦", "year": 1830, "title": "别人还在犹豫你已经站起来", "v": {"S": 2, "E": 4, "D": -2, "R": 3}, "place": "巴黎卢浮宫"}, {"key": "rain", "painting": "拴着皮带的狗的动态", "artist": "巴拉", "year": 1912, "title": "停不下来的人", "v": {"S": -4, "E": 2, "D": -2, "R": 1}, "place": "纽约州布法罗 奥尔布赖特-诺克斯美术馆"}]};
const RESULTS = DATA.results, QS = DATA.questions, DIMS = ["S","E","D","R"];
const DIMNAME = {S:["结构","随性","秩序"],E:["外放","内敛","外放"],D:["梦境","现实","象征"],R:["锐利","温和","锐利"]};
let step = 0, answers = {};

const app = document.getElementById('app');
const pct = () => Math.round(step / QS.length * 100);

function cover(){
  step = 0; answers = {};
  app.innerHTML = `
    <div class="cover">
      <h1>你的灵魂<br>是哪<em>一幅名画</em></h1>
      <p>12 道题 · 约 2 分钟</p>
      <p style="color:#6b625a;font-size:13px;margin-top:-6px">结果是一幅属于你的名画，以及它为什么是你</p>
    </div>
    <button class="btn" onclick="start()">开始</button>
  `;
}

function start(){ step = 0; render(); }

function render(){
  if(step >= QS.length){ return showResult(); }
  const q = QS[step];
  app.innerHTML = `
    <div class="bar"><i style="width:${pct()}%"></i></div>
    <div class="qnum">${String(step+1).padStart(2,'0')} / ${QS.length}</div>
    <p class="qtext">${q.text}</p>
    ${q.options.map((o,i)=>`<button class="opt" onclick="pick(${i})">${o.text}</button>`).join('')}
  `;
}

function pick(i){
  answers[QS[step].id] = i;
  step++;
  render();
  window.scrollTo({top:0});
}

function compute(){
  const raw = {S:0,E:0,D:0,R:0};
  QS.forEach(q=>{ const i = answers[q.id]; if(i!=null) raw[q.dim] += q.options[i].score; });
  let best = null;
  RESULTS.forEach(r=>{
    let d2 = 0;
    DIMS.forEach(d=>{ d2 += Math.pow(raw[d] - r.v[d], 2); });
    if(!best || d2 < best.d2) best = {d2, r};
  });
  return {raw, r: best.r};
}

function showResult(){
  let {raw, r} = compute();
  if(window.DEBUG_KEY){ r = RESULTS.find(x=>x.key===window.DEBUG_KEY); raw = r.v; }
  const key = r.key;
  app.innerHTML = `
    <div class="result-head">
      <div class="eyebrow">你的灵魂是</div>
      <h2>${r.title}</h2>
      <div class="painting">《${r.painting}》 ${r.artist} · ${r.year}</div>
    </div>
    <figure class="artwrap">
      <img class="art" src="${(window.IMG&&window.IMG[key])||("img/"+key+".jpg")}" alt="${r.painting}" onerror="this.parentNode.style.display='none'">
      <figcaption class="artcap">
        <span class="artname">《${r.painting}》</span>
        <span class="artmeta">${r.artist} · ${r.year}</span>
        <span class="artplace">${r.place || ""}</span>
      </figcaption>
    </figure>
    <div class="copy" id="copy"></div>
    <div class="dims">
      ${DIMS.map(d=>{
        const v = raw[d]; const p = (v + 6) / 12 * 100;
        return `<div class="dim">
          <div class="lab"><span>${DIMNAME[d][1]}</span><span>${DIMNAME[d][0]}</span><span>${DIMNAME[d][2]}</span></div>
          <div class="track"><i style="left:calc(${p}% - 2px);width:4px;height:11px;top:-3px"></i></div>
        </div>`;
      }).join('')}
    </div>
    <div class="sharehint">长按截图 · 结果可以存成壁纸</div>
    <button class="btn ghost" onclick="cover()">再测一次</button>
    <div class="foot">仅供娱乐参考，不具备专业测评效力</div>
  `;
  document.getElementById('copy').innerHTML = COPY[key] || '';
  window.scrollTo({top:0});
}

const COPY = {"starry": "<p>1889 年 5 月，梵高自己走进圣雷米的疗养院。窗外是他能看见的一小片天空。</p>\n<p>他把它画成了漩涡。星星在烧，柏树像火苗一样往上窜，整片天都在流动。可它看起来一点都不吵——因为那种翻涌被压在画面里，像一根被按住的弹簧。</p>\n<p><b>为什么这幅画是你：</b> 你像那棵柏树——画面里所有东西都在天上翻涌，只有它一声不响地往上长，又黑又直。别人看的是星空，你脚下踩的是土。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>表面情绪不大，内部一直在动，别人以为你\"挺平静的\"，其实你脑子里同时开着七八件事</li>\n<li>对细节异常敏感，一句语气的变化你能记很久</li>\n<li>有过那种\"什么都好，但我就是不舒服\"的时刻，说不清原因</li>\n<li>你不是不会表达，是找不到能装下这些东西的容器</li>\n<li>反复整理东西、反复听同一首歌、反复改一句话——那是漩涡在找出口</li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>把\"忍\"当成\"处理好\"。忍下去的东西不会消失，它会变成某个半夜的失眠</li>\n<li>以为别人也这样，所以从不解释。结果所有人都以为你没事</li>\n</ul>\n<p><b>一个建议：</b> 给你的漩涡一个固定的出口。不是\"想开点\"，是具体的一件事——涂鸦、跑步、写没人看的东西。<b>情绪需要一个容器，找不到容器就会溢到自己身上。</b></p>\n<p><b>别人眼里的你：</b></p>\n<p>熟人觉得你有意思，但不一定好接近；不熟的人觉得你话少、稳，甚至有点难懂。 只有少数几个人见过你真正失控的样子，而且那几个人通常不会拿这件事说出去。</p>\n<p><b>你可以发：</b></p>\n<blockquote>我的脑子里没有安静的时候，但我不觉得那是病。</blockquote>", "scream": "<p>蒙克写过那天傍晚：他和两个朋友走在桥上，太阳落下去，天变成血红色。他停下来，靠着栏杆，感到一声\"无限的、穿过自然的尖叫\"。</p>\n<p>注意——<b>叫的不是画面里那个人，是自然本身。</b> 那个人只是捂住了耳朵。</p>\n<p><b>为什么这幅画是你：</b> 你像那道被压弯的栏杆——整幅画都在尖叫，只有它是硬的，撑着别人走过去。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>能比别人早半步察觉气氛不对，早到有时候怀疑是不是自己想多了</li>\n<li>不太会装没事。别人还在笑的时候，你的脸已经变了</li>\n<li>会为还没发生的事提前焦虑，然后被人说\"想太多\"</li>\n<li>但真出事的时候，你是最先反应过来的那个</li>\n<li>你的直觉很少错，只是没人愿意听</li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>因为总被说\"你想多了\"，开始怀疑自己的判断，然后错过真正该跑的时候</li>\n<li>把警报拉得太响，反而让人觉得你夸张，真警报的时候没人信</li>\n</ul>\n<p><b>一个建议：</b> 把\"我觉得不对\"换成\"如果是 A 我们就走，如果是 B 就继续\"。<b>同样的直觉，换成一个可执行的判断，别人才接得住。</b></p>\n<p><b>别人眼里的你：</b></p>\n<p>有人觉得你敏感、戏剧化，有人觉得你\"总能提前发现问题\"。 同一件事，讨厌你的人说你多想，依赖你的人说你可靠——差别在于他们站在哪一边。</p>\n<p><b>你可以发：</b></p>\n<blockquote>我不是情绪化，我只是比别人先听见。</blockquote>", "pearl": "<p>维米尔画她的时候，让她回过头。她张着嘴，像要说什么，但那句话永远没出来。</p>\n<p>三百多年过去，没人知道她是谁。有研究者说这可能不是肖像，是一张\"特罗尼\"——画家为了研究表情和光影而画的虚构头像。</p>\n<p><b>一个连身份都不确定的人，成了世界上最著名的回头。</b></p>\n<p><b>为什么这幅画是你：</b> 你像那颗珍珠——整幅画最亮的一点，却是全场唯一不发光的东西，它只是把光还回去。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>在人群里话不多，但你记得每个人的状态</li>\n<li>不抢话，可你一句话就能把气氛定住</li>\n<li>反馈慢，因为你在心里过了一遍才开口</li>\n<li>有人说你\"高冷\"，其实你只是不想说没想清楚的话</li>\n<li>你身上有一种少见的<b>分寸感</b>：知道什么时候该出现、什么时候该消失</li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>把\"不说\"当成\"不需要说\"。很多关系不是散在争吵里，是散在\"我以为你懂\"里</li>\n<li>因为不表达，被别人替你说完了你的想法，然后你默默认了</li>\n</ul>\n<p><b>一个建议：</b> 一年里挑三个人，主动说一次你的在乎。不用长篇大论，一句\"那天谢谢你\"就够。<b>你的沉默很贵，但别让它贵到没人知道里面有什么。</b></p>\n<p><b>别人眼里的你：</b></p>\n<p>第一印象是\"有距离感\"，接触久了才发现你其实很在意。 你不解释，所以很多人对你的判断停在第一印象，而你不打算纠正。</p>\n<p><b>你可以发：</b></p>\n<blockquote>我不擅长表达，但我记得所有细节。</blockquote>", "kiss": "<p>克里姆特在这幅画上用了真金箔。它挂在美术馆里，灯一照会整片发亮。</p>\n<p>画里的两个人被裹在同一件金色斗篷里，只剩手、脸、脚露在外面——<b>他们没有看着对方。</b></p>\n<p><b>为什么这幅画是你：</b> 你像那件金色斗篷——把人整个包住，代价是自己的轮廓也被一起盖掉了。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>很难开始，但一旦开始就整个陷进去</li>\n<li>投入的方式是把边界让出去，不是留一手</li>\n<li>你的喜欢很具体：记得对方随口说过的小事，做没人要求你做的事</li>\n<li>你受的伤通常不是因为别人坏，是因为你给得太多</li>\n<li>你不缺理智，你是<b>主动选择不算计</b></li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>把\"全心投入\"当成\"必须被同等回报\"，然后失落</li>\n<li>一开始就把底牌全亮，对方还没准备好，你就已经到头了</li>\n</ul>\n<p><b>一个具体的场面：</b> 你曾经为了配合别人的时间，把自己原本的安排整个推翻，而且没跟任何人提这件事。对方至今不知道，你也没打算说。</p>\n<p><b>一个建议：</b> 投入之前先问一句：<b>如果这件事最后什么都没换回来，我还愿意做吗？</b> 愿意就去做，不愿意就慢一点。这不是算计，是让你能投入得更久。</p>\n<p><b>别人眼里的你：</b></p>\n<p>你对一个人好的时候，周围的人都能看出来。 也正因为看得出来，有些人会利用这一点——不是他们坏，是你不设防的样子太好懂。</p>\n<p><b>你可以发：</b></p>\n<blockquote>我认真起来是会把命搭进去的那种人。</blockquote>", "grande": "<p>修拉为这幅画工作了两年。他画了六十多张油画草图、几百张素描，最后把颜色一点一点排到画布上。</p>\n<p>整幅画由几百万个色点组成。<b>近看全是点，远看才是光。</b></p>\n<p><b>为什么这幅画是你：</b> 你像那些色点——单看一个什么都不是，堆到一起才变成一片光。你的价值只有在成规模时才显形。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>做事的默认姿势是\"先理清楚\"</li>\n<li>受不了将就，宁愿多花三倍时间做对</li>\n<li>桌面、文件夹、日程表是有秩序的，因为秩序让你安心</li>\n<li>别人觉得你慢，但你的东西很少返工</li>\n<li>你的力量不在于快，在于<b>可以持续</b></li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>因为\"还没准备好\"错过时机。画到第八十张草图，其实第一张就够了</li>\n<li>用秩序逃避决定——整理得越久，越不用开始</li>\n</ul>\n<p><b>一个具体的场面：</b> 你交出去的东西，别人第一眼说「就这样啊」，过两天回来说「确实好」。你已经不生气了，因为你习惯了。</p>\n<p><b>一个建议：</b> 给自己设一个\"草稿截止线\"：<b>只允许准备到某个时间点，到点必须交出去。</b> 你的 80 分比别人的 100 分更早到，而早到本身就是优势。</p>\n<p><b>别人眼里的你：</b></p>\n<p>做事的人会来找你，因为知道交给你不会烂尾。 但也因此，最麻烦的部分常常默认归你，而你不会拒绝——因为你确实做得比别人好。</p>\n<p><b>你可以发：</b></p>\n<blockquote>我不是慢，我是在把这件事做干净。</blockquote>", "memory": "<p>画里有三块融化的钟：一块挂在枯枝上，一块摊在桌沿，一块盖在一个奇怪的东西上。</p>\n<p>达利说，灵感来自晚饭时看到的一块融化的卡门贝尔奶酪。</p>\n<p><b>为什么这幅画是你：</b> 你像那块挂在枯枝上的钟——本来是硬的、准的，在你这里变成了软的、慢的，却还是能看时间。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>时间感和别人不一样，经常\"以为是下午，其实已经晚上了\"</li>\n<li>联想能力很强，从 A 能直接跳到 F，中间三步别人跟不上</li>\n<li>记忆是画面式的，不是条目式的</li>\n<li>经常在很日常的瞬间，突然想到一个完全不相关的东西</li>\n<li>你不缺专注，你缺的是<b>线性</b></li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>用\"我有灵感\"掩盖\"我没执行\"。想法多不是优势，落地才是</li>\n<li>因为总在脑子里预演，真到动手的时候反而没劲了</li>\n</ul>\n<p><b>一个具体的场面：</b> 你半夜想到一个绝妙的东西，告诉自己明天就做；第二天醒来只记得「昨天好像想到过什么」。</p>\n<p><b>一个建议：</b> 把想法从脑子里搬到纸上，只搬一条。<b>你的问题从来不是没想法，是想法太多导致一条都没走完。</b> 一次只推一条，其他的记下来放着。</p>\n<p><b>别人眼里的你：</b></p>\n<p>聊天时你是那个突然说出一句让人愣住的话的人。 有人觉得你跳脱，其实你只是把三句话压缩成了一句，剩下的在脑子里。</p>\n<p><b>你可以发：</b></p>\n<blockquote>我的时间不是线，是一摊。</blockquote>", "compo8": "<p>康定斯基能\"听见\"颜色。他说黄色是小号，蓝色是大提琴，红色是鼓。</p>\n<p>所以他画的东西没有具体形状——<b>他要画的本来就是声音本身。</b></p>\n<p><b>为什么这幅画是你：</b> 你像那只黑色大圆——画面里所有线条都在跑，只有它沉着不动，是整个混乱的重心。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>注意力是跳跃的，同时开着三件事</li>\n<li>对氛围极其敏感，一个房间的灯光不对你就不舒服</li>\n<li>不擅长按模板做事，模板会让你烦躁</li>\n<li>表达欲很强，但经常说到一半就换话题</li>\n<li>你不缺能量，缺的是<b>收拢</b></li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>开了很多头，每个都停在 30%</li>\n<li>因为\"感觉不对\"频繁推翻自己，最后一件事都没留下</li>\n</ul>\n<p><b>一个具体的场面：</b> 你跟人讲一件事，讲了三条线，对方只听懂一条；你换了个说法再讲一遍，还是只能讲清一条。</p>\n<p><b>一个建议：</b> 给想法排一个结构，哪怕是最粗糙的。康定斯基也是先有声音，后来才学会把它们放进几何里。<b>你不是要压制那些声音，是要给它们一个能站的架子。</b></p>\n<p><b>别人眼里的你：</b></p>\n<p>气氛里最活跃的那个，但也是最难抓住的那个。 你换话题的速度比谁都快，所以很少有人真的问过你：\"刚才那个想法后来怎么样了？\"如果实在排不出结构，就先只留一个声音，把另外六个写下来存着。它们不会跑。</p>\n<p><b>你可以发：</b></p>\n<blockquote>我脑子里同时开着七首歌。</blockquote>", "ophelia": "<p>米莱画的是《哈姆雷特》里的奥菲莉亚。她掉进河里，没有挣扎。</p>\n<p>莎士比亚写她\"像一条人鱼一样漂着\"，<b>嘴里还在唱歌</b>，直到衣服吸水把她拖下去。</p>\n<p>为了画这幅画，米莱让模特伊丽莎白·西达尔在装满水的浴缸里躺了很多天，冬天也是。浴缸下面点了油灯保温，灯灭了，她得了重病。</p>\n<p><b>为什么这幅画是你：</b> 你像她周围的那些花——被编成花环浮在水面上，好看，但没有根。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>很安静，安静到别人以为你没事</li>\n<li>不擅长求救，疼的时候会自己扛</li>\n<li>情绪是缓慢下沉的，不是爆发的</li>\n<li>有很多没说出口的东西，但你觉得说了也没用</li>\n<li>你身上有一种让人心疼的体面：<b>明明在下沉，还要保持姿态</b></li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>把\"不麻烦别人\"当成美德，直到某天突然撑不住</li>\n<li>用\"我还行\"结束每一次对话，然后真的没人再来问</li>\n</ul>\n<p><b>一个建议：</b> 找一个具体的、不会评价你的人，说一句具体的话。不用\"我很难受\"，说\"这周我睡不着\"。<b>米莱画的是画，你是活的。</b></p>\n<p><b>别人眼里的你：</b></p>\n<p>安静、好相处、几乎不给人添麻烦。 正因为如此，你的状态很少被主动过问——不吵的人，默认是没问题的。不用说得多清楚，说一个具体的时刻就行——具体的话才有重量。</p>\n<p><b>你可以发：</b></p>\n<blockquote>我一直在往下沉，但没人看出来。</blockquote>", "liberty": "<p>1830 年 7 月，巴黎街头发动革命。德拉克洛瓦没有上街，但他画了这幅画。</p>\n<p>画面中间那个女人举着旗，回头看——<b>她在叫人跟上来。</b></p>\n<p><b>为什么这幅画是你：</b> 你像她脚下的那堆尸体——画面里所有人都在往前，你是被踩过去的那一层，也是所有人能往前的原因。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>不太纠结，决定做得比别人快</li>\n<li>一群人卡住的时候，通常是你说\"那就这样吧\"</li>\n<li>不怕得罪人，因为你更怕事情烂在那里</li>\n<li>讨厌拖延和无意义的讨论</li>\n<li>你的价值不在于想得多清楚，在于<b>敢先动</b></li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>推着别人走，忘了他们需要时间消化</li>\n<li>因为总在做决定，被默认\"你能搞定\"，最后所有事都压到你身上</li>\n</ul>\n<p><b>一个具体的场面：</b> 一群人卡在「那要不要去」上讨论了四十分钟，你说「我先去，你们随意」，然后真的走了。</p>\n<p><b>一个建议：</b> 往前走的时候回头看一眼，问一句\"跟得上吗\"。<b>领头最难的不是方向，是让后面的人愿意跟。</b></p>\n<p><b>别人眼里的你：</b></p>\n<p>靠得住、有主意、关键时刻站得出来。 但也很少有人问你要不要休息，因为你从来没在他们面前垮过。你不需要每次都第一个动，有时候等三十秒，让别人的犹豫变成他们的选择。</p>\n<p>真正的领头人不需要一直举旗，只需要在没人敢动的时候先动一下。</p>\n<p><b>你可以发：</b></p>\n<blockquote>我不是冲动，我是受不了所有人都在等。</blockquote>", "rain": "<p>巴拉画的是朋友的一条小狗被牵着散步。他没画四条腿，他画了几十条。</p>\n<p>因为狗在跑，眼睛看到的是<b>连续的影子</b>，不是静止的腿。这幅画成了未来主义的宣言：<b>运动本身才是真实</b>，静止的那个瞬间是假的。</p>\n<p><b>为什么这幅画是你：</b> 你像那条皮带——画面上全是运动，只有它是绷直的、连着另一头的，你所有的速度都拴在某个东西上。</p>\n<p><b>你大概是这样的人：</b></p>\n<ul>\n<li>很难在原地待着，停下来会让你有点焦虑</li>\n<li>计划经常改，因为你边走边看</li>\n<li>对\"准备好了再做\"这种话没耐心</li>\n<li>东西往往开始得潦草，后来才越来越像样</li>\n<li>你不缺执行力，缺的是<b>留白</b></li>\n</ul>\n<p><b>你可能踩过的坑：</b></p>\n<ul>\n<li>用忙碌代替方向。跑得很快，但没在看跑到哪</li>\n<li>一旦停下来就空，所以不敢停</li>\n</ul>\n<p><b>一个建议：</b> 每周留一段\"什么都不干\"的时间，一开始会很难受，那是正常的。<b>巴拉画的是运动，但让画面成立的，是那些模糊之间留出的空隙。</b></p>\n<p><b>你可以发：</b></p>\n<blockquote>我停下来会难受，所以我一直往前。</blockquote>\n<p>| 维度 | 低分 | 高分 | |---|---|---| | <b>结构</b> | 随性、边走边看 | 秩序、先理清楚 | | <b>外放</b> | 内敛、独处充电 | 外放、越聊越有劲 | | <b>梦境</b> | 现实、记事实 | 象征、记画面 | | <b>锐利</b> | 温和、留余地 | 锐利、直接说 |</p>"};
